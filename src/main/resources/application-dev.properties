#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:postgresql://localhost:5432/crypto
spring.datasource.username=postgres
spring.datasource.password=*B226y5ia
spring.datasource.driver-class-name=org.postgresql.Driver

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.boot.autoconfigure=DEBUG

spring.jpa.show-sql=false

# Disable the "Open in View" anti-pattern
spring.jpa.open-in-view=false

# Set the default level for all loggers (the "root") to INFO
logging.level.root=INFO

# Debug Spring or Hibernate
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.output.ansi.enabled=ALWAYS


jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.accessExpiration=86400000
jwt.refreshExpiration=3600000


